upstream ask_lifestyle_medicine_api {
    server 127.0.0.1:8080;
}

upstream ask_lifestyle_medicine_web {
    server 127.0.0.1:22480;
}

server {
    listen 443 ssl http2;
    server_name ask.example.stanford.edu;

    # TLS certificate configuration is managed by Stanford.

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://ask_lifestyle_medicine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /faculty/ {
        alias /opt/ask-lifestyle-medicine/current/artifacts/faculty/dist/public/;
        try_files $uri $uri/ /faculty/index.html;
    }

    location / {
        proxy_pass http://ask_lifestyle_medicine_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Replace with Stanford's exact WordPress origins before launch.
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.stanford.edu" always;
    }
}