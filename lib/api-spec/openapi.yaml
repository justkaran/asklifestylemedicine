        "400": { description: Not published. }
        "401": { description: Not authenticated. }
        "403": { description: Platform admin (CVO) only. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/comments:
    post:
      tags: [decision-room]
      operationId: createReleaseComment
      summary: Add a comment or challenge to a release
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseCommentCreateBody" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseComment" }
        "400": { description: Invalid input or mode mismatch. }
        "401": { description: Not authenticated. }
        "403": { description: No Decision Room access. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/comments/{commentId}:
    patch:
      tags: [decision-room]
      operationId: updateReleaseComment
      summary: Resolve or re-open a comment/challenge
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: commentId,
            in: path,
            required: true,
            schema: { type: integer },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseCommentUpdateBody" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseComment" }
        "400": { description: Invalid input or mode mismatch. }
        "401": { description: Not authenticated. }
        "403": { description: No Decision Room access. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/review-links:
    post:
      tags: [decision-room]
      operationId: createReviewLink
      summary: Create a one-time-reveal opaque review link for a release
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewLinkCreateBody" }
      responses:
        "201":
          description: Created. rawToken is returned ONCE only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewLinkCreated" }
        "400": { description: Invalid input. }
        "401": { description: Not authenticated. }
        "403": { description: No Decision Room access. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/review-links/{linkId}/revoke:
    post:
      tags: [decision-room]
      operationId: revokeReviewLink
      summary: Revoke an issued read-only review link
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: linkId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Revoked. Repeating the request is idempotent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewLinkRevoked" }
        "400": { description: Invalid input or mode mismatch. }
        "401": { description: Not authenticated. }
        "403": { description: Only the link creator or CVO may revoke it. }
        "404": { description: Not found. }

  /decision-room/review/{token}:
    get:
      tags: [decision-room]
      operationId: getPublicReview
      summary: Public read-only review of a release via opaque token (no auth required)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public-safe release view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicReviewResponse" }
        "404": { description: "Token invalid or expired." }

  /decision-room/decisions:
    get:
      tags: [decision-room]
      operationId: listDecisions
      summary: List decisions (newest first)
      responses:
        "200":
          description: Decisions.
          content:
            application/json:
              schema:
                type: object
                required: [decisions]
                properties:
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/DecisionSummary" }
    post:
      tags: [decision-room]
      operationId: createDecision
      summary: Frame a new decision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionDetail" }
        "400":
          description: Invalid input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /decision-room/decisions/{id}:
    get:
      tags: [decision-room]
      operationId: getDecision
      summary: One decision with its pillar consultations
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Decision detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionDetail" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
    patch:
      tags: [decision-room]
      operationId: updateDecision
      summary: Update a decision (own view, final call, status, checked steps)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionDetail" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
    delete:
      tags: [decision-room]
      operationId: deleteDecision
      summary: Delete a decision and its consultations
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /decision-room/decisions/{id}/consult:
    post:
      tags: [decision-room]
      operationId: consultPillars
      summary: Ask the governed pillars for perspectives on this decision
      description: >
        Runs the decision question through the governed retrieval pipeline for
        each requested pillar and stores one consultation per pillar. Requires
        the author's own view to be recorded first (automation-bias rule).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultRequest" }
      responses:
        "200":
          description: Consultations created.
          content:
            application/json:
              schema:
                type: object
                required: [consultations]
                properties:
                  consultations:
                    type: array
                    items: { $ref: "#/components/schemas/PillarConsultation" }
        "400":
          description: Own view missing or invalid pillars.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /decision-room/steps:
    get:
      tags: [decision-room]
      operationId: listAiSteps
      summary: The editable protocol of steps for considering AI in decisions
      responses:
        "200":
          description: Steps in order.
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps:
                    type: array
                    items: { $ref: "#/components/schemas/AiStep" }
    post:
      tags: [decision-room]
      operationId: createAiStep
      summary: Add a protocol step
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiStepInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiStep" }
        "400":
          description: Invalid input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /decision-room/steps/{id}:
    patch:
      tags: [decision-room]
      operationId: updateAiStep
      summary: Edit or reorder a protocol step
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiStepUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiStep" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
    delete:
      tags: [decision-room]
      operationId: deleteAiStep
      summary: Remove a protocol step
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
components:
  schemas:
    # ── CVO Release Governance Schemas ─────────────────────────────────────
    DecisionRoomMe:
      type: object
      required: [userId, fullName, isCvo, hasMembership, canFacultySignoff]
      properties:
        userId: { type: integer }
        fullName: { type: string }
        email: { type: string }
        isCvo: { type: boolean }
        hasMembership: { type: boolean }
        canFacultySignoff:
          type: boolean
          description: True only for a non-CVO member with an active steward role.

    ReleaseMode:
      type: string
      enum: [test, live]

    ReleaseStatus:
      type: string
      enum: [draft, in_review, ready, published, withdrawn]

    ReleaseSummary:
      type: object
      required:
        [
          id,
          mode,
          status,
          institutionName,
          namedExpert,
          publicGuidance,
          isSample,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        mode: { $ref: "#/components/schemas/ReleaseMode" }
        status: { $ref: "#/components/schemas/ReleaseStatus" }
        institutionName: { type: string }
        namedExpert: { type: string }
        publicGuidance: { type: string }
        isSample: { type: boolean }
        facultyApprovedAt: { type: string, format: date-time, nullable: true }
        cvoVerifiedAt: { type: string, format: date-time, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReleaseAuditEvent:
      type: object
      required: [id, mode, releaseId, actorName, eventType, createdAt]
      properties:
        id: { type: integer }
        mode: { $ref: "#/components/schemas/ReleaseMode" }
        releaseId: { type: integer }
        actorName: { type: string }
        eventType: { type: string }
        detail: { type: object, additionalProperties: true, nullable: true }
        createdAt: { type: string, format: date-time }

    ReleaseDetail:
      type: object
      required:
        [
          id,
          mode,
          status,
          institutionName,
          namedExpert,
          publicGuidance,
          intendedAudience,
          sourceAndProvenanceNotes,
          scopeLimits,
          recoursePath,
          externallyCleared,
          revenueTermsAcknowledged,
          isSample,
          consultations,
          comments,
          auditEvents,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        mode: { $ref: "#/components/schemas/ReleaseMode" }
        status: { $ref: "#/components/schemas/ReleaseStatus" }
        institutionName: { type: string }
        namedExpert: { type: string }
        ownerFacultyUserId: { type: integer, nullable: true }
        publicGuidance: { type: string }
        intendedAudience: { type: ["string", "null"] }
        sourceAndProvenanceNotes: { type: ["string", "null"] }
        scopeLimits: { type: ["string", "null"] }
        recoursePath: { type: ["string", "null"] }
        externallyCleared: { type: boolean }
        revenueTermsAcknowledged: { type: boolean }
        revenueTermsNote: { type: string, nullable: true }
        facultyApprovedAt: { type: string, format: date-time, nullable: true }
        facultyApprovedById: { type: integer, nullable: true }
        facultyApprovedByName: { type: string, nullable: true }
        cvoVerifiedAt: { type: string, format: date-time, nullable: true }
        cvoVerifiedById: { type: integer, nullable: true }
        cvoVerifiedByName: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        withdrawnAt: { type: string, format: date-time, nullable: true }
        isSample: { type: boolean }
        consultations:
          type: array
          items: { $ref: "#/components/schemas/PillarConsultation" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/ReleaseComment" }
        auditEvents:
          type: array
          description: Bounded newest-first audit history (max 50 events).
          items: { $ref: "#/components/schemas/ReleaseAuditEvent" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReleaseCreateBody:
      type: object
      required: [institutionName, namedExpert, publicGuidance]
      properties:
        institutionName: { type: string, minLength: 1, maxLength: 200 }
        namedExpert: { type: string, minLength: 1, maxLength: 200 }
        publicGuidance: { type: string, minLength: 1, maxLength: 10000 }
        intendedAudience: { type: string, maxLength: 4000 }
        sourceAndProvenanceNotes: { type: string, maxLength: 8000 }
        scopeLimits: { type: string, maxLength: 8000 }
        recoursePath: { type: string, maxLength: 4000 }
        externallyCleared: { type: boolean }
        revenueTermsAcknowledged: { type: boolean }
        revenueTermsNote: { type: string, maxLength: 2000 }

    ReleaseUpdateBody:
      type: object
      properties:
        institutionName: { type: string, minLength: 1, maxLength: 200 }
        namedExpert: { type: string, minLength: 1, maxLength: 200 }
        publicGuidance: { type: string, minLength: 1, maxLength: 10000 }
        intendedAudience: { type: ["string", "null"], maxLength: 4000 }
        sourceAndProvenanceNotes: { type: ["string", "null"], maxLength: 8000 }
        scopeLimits: { type: ["string", "null"], maxLength: 8000 }
        recoursePath: { type: ["string", "null"], maxLength: 4000 }
        externallyCleared: { type: boolean }
        revenueTermsAcknowledged: { type: boolean }
        revenueTermsNote: { type: ["string", "null"], maxLength: 2000 }

    ReleaseConsultBody:
      type: object
      required: [pillarSlugs]
      properties:
        pillarSlugs:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: string }

    FacultySignoffBody:
      type: object
      properties:
        note: { type: string, maxLength: 2000 }

    CvoVerificationBody:
      type: object
      properties:
        note: { type: string, maxLength: 2000 }

    ReleaseComment:
      type: object
      required:
        [
          id,
          releaseId,
          mode,
          authorId,
          authorName,
          kind,
          body,
          status,
          createdAt,
        ]
      properties:
        id: { type: integer }
        releaseId: { type: integer }
        mode: { $ref: "#/components/schemas/ReleaseMode" }
        authorId: { type: integer }
        authorName: { type: string }
        kind:
          type: string
          enum: [comment, challenge]
        body: { type: string }
        status:
          type: string
          enum: [open, resolved]
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedById: { type: integer, nullable: true }
        resolvedByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReleaseCommentCreateBody:
      type: object
      required: [kind, body]
      properties:
        kind:
          type: string
          enum: [comment, challenge]
        body: { type: string, minLength: 1, maxLength: 10000 }

    ReleaseCommentUpdateBody:
      type: object
      properties:
        status:
          type: string
          enum: [open, resolved]
        body: { type: string, minLength: 1, maxLength: 10000 }

    ReviewLinkCreateBody:
      type: object
      properties:
        expiresInDays: { type: integer, minimum: 1, maximum: 365 }

    ReviewLinkCreated:
      type: object
      required: [id, rawToken, expiresAt, createdAt]
      properties:
        id: { type: integer }
        rawToken:
          {
            type: string,
            description: "Returned once only — store immediately.",
          }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ReviewLinkRevoked:
      type: object
      required: [id, revokedAt]
      properties:
        id: { type: integer }
        revokedAt: { type: string, format: date-time }

    PublicConsultation:
      type: object
      description: Externally safe consultation view (no numeric IDs).
      required:
        [pillarSlug, pillarName, status, answerText, citations, createdAt]
      properties:
        pillarSlug: { type: string }
        pillarName: { type: string }
        status:
          type: string
          enum: [covered, uncovered, error]
        answerText: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/ConsultCitation" }
        createdAt: { type: string, format: date-time }

    PublicReviewResponse:
      type: object
      required: [release, auditSummary]
      properties:
        release:
          type: object
          description: Externally safe release fields only. No numeric IDs, no internal emails, no source notes, no comments.
          required:
            [institutionName, namedExpert, publicGuidance, status, publishedAt]
          properties:
            institutionName: { type: string }
            namedExpert: { type: string }
            publicGuidance: { type: string }
            intendedAudience: { type: string, nullable: true }
            scopeLimits: { type: string, nullable: true }
            recoursePath: { type: string, nullable: true }
            status: { $ref: "#/components/schemas/ReleaseStatus" }
            facultyApprovedByName: { type: string, nullable: true }
            cvoVerifiedByName: { type: string, nullable: true }
            publishedAt: { type: string, format: date-time, nullable: true }
            consultations:
              type: array
              items: { $ref: "#/components/schemas/PublicConsultation" }
        auditSummary:
          type: object
          required: [eventCount, lastEventAt]
          properties:
            eventCount: { type: integer }
            lastEventAt: { type: string, format: date-time, nullable: true }

    ReleaseModeSummary:
      type: object
      required:
        [mode, needsAttention, readyToRelease, publishedAndTraceable, recent]
      properties:
        mode: { $ref: "#/components/schemas/ReleaseMode" }
        needsAttention:
          type: object
          required: [count, items]
          properties:
            count: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/ReleaseSummary" }
        readyToRelease:
          type: object
          required: [count, items]
          properties:
            count: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/ReleaseSummary" }
        publishedAndTraceable:
          type: object
          required: [count, items]
          properties:
            count: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/ReleaseSummary" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/ReleaseSummary" }

    # ── End CVO Release Governance Schemas ──────────────────────────────────
    DecisionRoomPillar:
      type: object
      required: [slug, name, available]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        stewardName: { type: ["string", "null"] }
        available:
          type: boolean
          description: False for pillars still in preparation (no approved corpus yet).
    DecisionStatus:
      type: string
      enum: [framing, consulting, deciding, decided]
    DecisionSummary:
      type: object
      required:
        [id, title, question, status, consultationCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        question: { type: string }
        status: { $ref: "#/components/schemas/DecisionStatus" }
        consultationCount: { type: integer }
        decidedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PillarConsultation:
      type: object
      required:
        [id, pillarSlug, pillarName, status, answerText, citations, createdAt]
      properties:
        id: { type: integer }
        pillarSlug: { type: string }
        pillarName: { type: string }
        status:
          type: string
          enum: [covered, uncovered, error]
          description: covered = grounded answer with citations; uncovered = the pillar's approved corpus doesn't reach this question (shown honestly, never invented).
        answerText: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/ConsultCitation" }
        createdAt: { type: string, format: date-time }
    ConsultCitation:
      type: object
      required: [title]
      properties:
        title: { type: string }
        authors: { type: ["string", "null"] }
        year: { type: ["integer", "null"] }
        sourceUrl: { type: ["string", "null"] }
    DecisionDetail:
      type: object
      required:
        [
          id,
          title,
          question,
          context,
          ownView,
          finalCall,
          outcome,
          status,
          checkedStepIds,
          consultations,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        question: { type: string }
        context: { type: ["string", "null"] }
        ownView:
          type: ["string", "null"]
          description: The author's own position, recorded BEFORE any pillar/AI consultation.
        finalCall: { type: ["string", "null"] }
        outcome: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/DecisionStatus" }
        checkedStepIds:
          type: array
          items: { type: integer }
        decidedAt: { type: ["string", "null"], format: date-time }
        consultations:
          type: array
          items: { $ref: "#/components/schemas/PillarConsultation" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DecisionInput:
      type: object
      required: [title, question]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        question: { type: string, minLength: 1, maxLength: 1000 }
        context: { type: string, maxLength: 4000 }
    DecisionUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        question: { type: string, minLength: 1, maxLength: 1000 }
        context: { type: ["string", "null"], maxLength: 4000 }
        ownView: { type: ["string", "null"], maxLength: 8000 }
        finalCall: { type: ["string", "null"], maxLength: 8000 }
        outcome: { type: ["string", "null"], maxLength: 8000 }
        status: { $ref: "#/components/schemas/DecisionStatus" }
        checkedStepIds:
          type: array
          items: { type: integer }
    ConsultRequest:
      type: object
      required: [pillarSlugs]
      properties:
        pillarSlugs:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: string }
    AiStep:
      type: object
      required: [id, text, position]
      properties:
        id: { type: integer }
        text: { type: string }
        position: { type: integer }
    AiStepInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
    AiStepUpdate:
      type: object
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        position: { type: integer }
    DecisionRoomSummary:
      type: object
      required: [total, byStatus, recent]
      properties:
        total: { type: integer }
        byStatus:
          type: object
          required: [framing, consulting, deciding, decided]
          properties:
            framing: { type: integer }
            consulting: { type: integer }
