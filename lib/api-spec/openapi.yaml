              schema:
                type: object
                required: [booking]
                properties:
                  booking: { $ref: "#/components/schemas/FrameworkBooking" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /phone/subscribe:
    post:
      operationId: subscribePhone
      tags: [phone]
      summary: Capture a phone number opt-in for a consumer product
      description: >
        Public, consent-gated phone capture for the Nightly sleep surface.
        Normalizes the number to E.164, records
        explicit consent, stores it as pending, and (idempotently) sends one
        opt-in confirmation iMessage. Re-submitting the same number on the same
        product never duplicates or re-spams.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneSubscribeInput" }
      responses:
        "200":
          description: Captured (or already captured).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneSubscribeResult" }
        "400":
          description: Missing/invalid phone, product, or consent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "500":
          description: Capture failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /account/notifications:
    get:
      operationId: getNotificationSettings
      tags: [account]
      summary: Get the signed-in consumer's notification channel preferences
      description: >
        Returns the caller's per-product notification channel preferences
        (email / imessage / both), the products they are entitled to, and the
        status of any phone number linked to their account. Scoped strictly to
        the cookie-resolved consumer; never exposes another account.
      responses:
        "200":
          description: The caller's notification settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401":
          description: Not signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "500":
          description: Load failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /account/notifications/{product}:
    put:
      operationId: updateNotificationChannel
      tags: [account]
      summary: Set the channel preference for one product
      description: >
        Set how the caller is notified for a given product. Choosing "imessage"
        or "both" requires a confirmed phone number linked to the account; the
        server rejects the change otherwise.
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: string
            enum: [nightly]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateNotificationChannelInput" }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400":
          description: Invalid product or channel, or iMessage without a confirmed phone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "401":
          description: Not signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "500":
          description: Update failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /account/phone:
    post:
      operationId: addAccountPhone
      tags: [account]
      summary: Add and verify a phone number for the signed-in consumer
      description: >
        Links a phone number to the caller's account and (idempotently) sends a
        single opt-in confirmation iMessage, reusing the existing double opt-in.
        Confirming (reply YES or tap the link) makes the number usable for the
        iMessage channel. Consent is mandatory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddAccountPhoneInput" }
      responses:
        "200":
          description: Linked (or already linked); confirmation awaited if pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddAccountPhoneResult" }
        "400":
          description: Missing/invalid phone or consent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "401":
          description: Not signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "500":
          description: Link failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /tts/minicast:
    post:
      operationId: minicastTts
      summary: Produce a two-voice "Nightly" podcast episode from a parsed answer
      description: >-
        Builds a fixed 10-turn conversational episode (hook, welcome, answer,
        reaction, action, bridge, finding, takeaway, closing, outro) and calls
        ElevenLabs with the male host voice for host turns and the expert
        avatar voice for expert turns. Returns an ordered array of
        base64-encoded MP3 voice segments; theme music (5s entry, 30s outro)
        is layered entirely client-side from a static track.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinicastRequest"
      responses:
        "200":
          description: Array of audio segments in episode order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinicastResponse"
        "400":
          description: Missing or invalid fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "502":
          description: ElevenLabs TTS service error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
