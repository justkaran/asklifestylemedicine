        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CvoVerificationBody" }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDetail" }
        "400": { description: "Mode mismatch or faculty signoff missing." }
        "401": { description: Not authenticated. }
        "403": { description: Platform admin (CVO) only. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/publish:
    post:
      tags: [decision-room]
      operationId: publishRelease
