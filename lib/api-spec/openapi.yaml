openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sources
    description: Knowledge ingestion (papers + chunks + embeddings)
  - name: interpretations
    description: Faculty interpretations, review workflow, and discussion threads
  - name: reputation
    description: AI reputation tracking — see how external AI engines answer questions in a topic
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: account
    description: Signed-in consumer account hub (subscriptions, notifications).
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageErrorEnvelope" }
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageErrorEnvelope" }
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content streamed.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: File not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageErrorEnvelope" }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content streamed.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Object not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageErrorEnvelope" }
  /pillars/{slug}/resources:
    get:
      operationId: getPillarResources
      tags: [sources]
      summary: Get curated external resource links for a pillar
      description: >
        Returns operator-seeded external resource links for the given pillar,
        ordered by display_order. Public, read-only. Returns an empty array for
        pillars with no resource rows. Used to surface "Learn more" panels on
        the UNCOVERED agent path.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [resources]
                properties:
                  resources:
                    type: array
                    items: { $ref: "#/components/schemas/PillarResource" }
        "404":
          description: Pillar not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /faculty/pillars/{slug}/sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List sources in a pillar
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SourceStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/SourceListItem" }
    post:
      operationId: ingestSource
      tags: [sources]
      summary: Ingest a new source (PDF or text)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              allOf:
                - if:
                    properties:
                      kind: { const: paper }
                    required: [kind]
                  then:
                    required: [rightsBasis]
              properties:
                file:
                  type: string
                  format: binary
                kind: { $ref: "#/components/schemas/SourceKind" }
                title: { type: string }
                authors: { type: string }
                year: { type: integer }
                journal: { type: string }
                doi: { type: string }
                abstract: { type: string }
                sourceUrl: { type: string }
                studyDesign:
                  type: string
                  nullable: true
                  description: >-
                    Optional controlled-vocabulary study type (e.g. rct,
                    meta_analysis, cohort). Empty string is treated as unset.
                text: { type: string }
                rightsBasis:
                  $ref: "#/components/schemas/SourceRightsBasis"
                  description: Required when kind is paper.
      responses:
        "201":
          description: Ingested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestSourceResponse" }
  /faculty/pillars/{slug}/sources/{id}:
    get:
      operationId: getSource
      tags: [sources]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
  /faculty/pillars/{slug}/sources/{id}/transition:
    post:
      operationId: transitionSource
      tags: [sources]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/SourceStatus" }
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { $ref: "#/components/schemas/SourceStatus" }
                  retentionStatus:
                    { $ref: "#/components/schemas/SourceRetentionStatus" }
                  purged: { type: boolean }
  /faculty/pillars/{slug}/sources/{id}/exclude:
    post:
      operationId: excludeDiscoveredSource
      tags: [sources]
      summary: Exclude and archive automatically discovered work (steward only)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Excluded, or already excluded
          content:
            application/json:
              schema:
                type: object
                required:
                  [id, status, automaticallyDiscovered, excluded, unchanged, purged]
                properties:
                  id: { type: integer }
                  status: { $ref: "#/components/schemas/SourceStatus" }
                  automaticallyDiscovered: { type: boolean }
                  excluded: { type: boolean }
                  excludedAt:
                    { type: string, format: date-time, nullable: true }
                  exclusionReason: { type: string, nullable: true }
                  unchanged: { type: boolean }
                  purged: { type: boolean }
        "409":
          description: Source was not created by research discovery
  /faculty/pillars/{slug}/sources/{id}/rights:
    patch:
      operationId: updateSourceRights
      tags: [sources]
      summary: Record a source's full-text rights basis (steward only)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rightsBasis]
              properties:
                rightsBasis: { $ref: "#/components/schemas/SourceRightsBasis" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  rightsBasis:
                    { $ref: "#/components/schemas/SourceRightsBasis" }
                  retentionStatus:
                    { $ref: "#/components/schemas/SourceRetentionStatus" }
  /faculty/pillars/{slug}/sources/{id}/assessment:
    get:
      operationId: getSourceAssessment
      tags: [sources]
      summary: Current three-axis reliability assessment for a source
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceAssessment" }
    put:
      operationId: saveSourceAssessment
      tags: [sources]
      summary: Save (draft) or approve a reliability assessment (steward only)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceAssessmentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceAssessment" }
  /faculty/pillars/{slug}/sources/{id}/assessment/draft:
    post:
      operationId: draftSourceAssessment
      tags: [sources]
      summary: Generate an AI first-pass reliability draft (steward only)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceAssessment" }
  /faculty/sources/{id}/interpretations:
    get:
      operationId: listInterpretations
      tags: [interpretations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [interpretations]
                properties:
                  interpretations:
                    type: array
                    items: { $ref: "#/components/schemas/Interpretation" }
                  role: { type: string, nullable: true }
                  pillar:
                    type: object
                    properties:
                      id: { type: integer }
                      slug: { type: string }
                      name: { type: string }
    post:
      operationId: createInterpretation
      tags: [interpretations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterpretationBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interpretation" }
  /faculty/interpretations/{id}:
    patch:
      operationId: updateInterpretation
      tags: [interpretations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterpretationBodyPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interpretation" }
  /faculty/interpretations/{id}/transition:
    post:
      operationId: transitionInterpretation
      tags: [interpretations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/InterpretationStatus" }
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: integer }
                  status: { $ref: "#/components/schemas/InterpretationStatus" }
                  version: { type: integer }
                  chunks:
                    type: integer
                    description: Number of retrieval chunks written (only on approval).
                  sentBack:
                    type: boolean
                    description: True when a steward send-back event was recorded.
                  unchanged:
                    type: boolean
                    description: True when the requested status equals the current status.
  /faculty/interpretations/{id}/versions:
    get:
      operationId: listInterpretationVersions
      tags: [interpretations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      { $ref: "#/components/schemas/InterpretationVersion" }
  /faculty/interpretations/{id}/comments:
    get:
      operationId: listInterpretationComments
      tags: [interpretations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      { $ref: "#/components/schemas/InterpretationComment" }
    post:
      operationId: createInterpretationComment
      tags: [interpretations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                quotedText: { type: string }
                parentCommentId: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterpretationComment" }
  /faculty/pillars/{slug}/inbox:
    get:
      operationId: getStewardInbox
      tags: [interpretations]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pillar, pending]
                properties:
                  pillar:
                    type: object
                    properties:
                      id: { type: integer }
                      slug: { type: string }
                      name: { type: string }
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        sourceId: { type: integer }
                        sourceTitle: { type: string }
                        sourceAuthors: { type: string, nullable: true }
                        sourceYear: { type: integer, nullable: true }
                        answer: { type: string }
                        version: { type: integer }
                        authorId: { type: integer, nullable: true }
                        authorName: { type: string, nullable: true }
                        authorEmail: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
  /reputation/topics/{slug}:
    get:
      operationId: getReputationTopic
      tags: [reputation]
      summary: Get a reputation topic with its prompts and latest run summary
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReputationTopicDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /reputation/topics/{slug}/runs:
    post:
      operationId: triggerReputationRun
      tags: [reputation]
      summary: Manually trigger a new reputation run across all engines
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReputationRunInput" }
      responses:
        "202":
          description: Run accepted and started in background
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReputationRunSummary" }
        "404":
          description: Topic not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /reputation/runs/{id}:
    get:
      operationId: getReputationRun
      tags: [reputation]
      summary: Get a reputation run with all per-engine answers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReputationRunDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /faculty/cross-pillar/pillars:
    get:
      operationId: listCrossPillarPillars
      tags: [cross-pillar]
      summary: Every pillar with counts of its approved interpretations and sources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pillars]
                properties:
                  pillars:
                    type: array
                    items: { $ref: "#/components/schemas/CrossPillarSummary" }
  /faculty/cross-pillar/interpretations:
    get:
      operationId: listCrossPillarInterpretations
      tags: [cross-pillar]
      summary: Every pillar's approved interpretations, optionally filtered by pillar slug
      parameters:
        - name: pillar
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [interpretations]
                properties:
                  interpretations:
                    type: array
                    items:
                      { $ref: "#/components/schemas/CrossPillarInterpretation" }
  /faculty/cross-pillar/merge-requests:
    get:
      operationId: listCrossPillarMergeRequests
      tags: [cross-pillar]
      summary: List merge requests in the steward's inbox (to review) or outbox (mine)
      parameters:
        - name: box
          in: query
          required: false
          schema: { type: string, enum: [inbox, outbox] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [proposed, approved, declined] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      { $ref: "#/components/schemas/CrossPillarMergeRequest" }
    post:
      operationId: proposeCrossPillarMergeRequest
      tags: [cross-pillar]
      summary: Propose adopting another pillar's approved interpretation into yours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceInterpretationId, targetPillarId]
              properties:
                sourceInterpretationId: { type: integer }
                targetPillarId: { type: integer }
                note: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrossPillarMergeRequest" }
        "400":
          description: Invalid request or interpretation not adoptable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "403":
          description: Not a steward of the receiving pillar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "409":
          description: An open request already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /faculty/cross-pillar/merge-requests/{id}/approve:
    post:
      operationId: approveCrossPillarMergeRequest
      tags: [cross-pillar]
      summary: Owning steward approves; an attributed copy is merged into the target pillar
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Approved and merged
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  resultingSourceId: { type: integer }
                  resultingInterpretationId: { type: integer }
        "403":
          description: Not a steward of the owning pillar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "409":
          description: Request already resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /faculty/cross-pillar/merge-requests/{id}/decline:
    post:
      operationId: declineCrossPillarMergeRequest
      tags: [cross-pillar]
      summary: Owning steward declines a merge request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "403":
          description: Not a steward of the owning pillar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "409":
          description: Request already resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /faculty/frameworks:
    get:
      operationId: listFrameworks
      tags: [frameworks]
      summary: Frameworks in pillars the caller stewards (admins see all)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [frameworks]
                properties:
                  frameworks:
                    type: array
                    items: { $ref: "#/components/schemas/FrameworkListItem" }
    post:
      operationId: createFramework
      tags: [frameworks]
      summary: Create a framework in a pillar the caller stewards
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFrameworkInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [framework]
                properties:
                  framework: { $ref: "#/components/schemas/Framework" }
        "400":
          description: Invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "403":
          description: Not a steward of the pillar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /faculty/frameworks/published:
    get:
      operationId: listPublishedFrameworks
      tags: [frameworks]
      summary: Every published framework with owner + pillar attribution
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [frameworks]
                properties:
                  frameworks:
                    type: array
                    items: { $ref: "#/components/schemas/FrameworkListItem" }
  /faculty/frameworks/{id}:
    patch:
      operationId: updateFramework
      tags: [frameworks]
      summary: Edit a framework's fields
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFrameworkInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [framework]
                properties:
                  framework: { $ref: "#/components/schemas/Framework" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /faculty/frameworks/{id}/publish:
    post:
      operationId: publishFramework
      tags: [frameworks]
      summary: Publish a framework
      parameters:
