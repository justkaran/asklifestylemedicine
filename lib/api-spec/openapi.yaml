  # ── CVO Release Governance (mode-scoped) ───────────────────────────────
  /decision-room/{mode}/summary:
    get:
      tags: [decision-room]
      operationId: getReleaseModeSummary
      summary: Dashboard summary for a release mode (test|live)
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
      responses:
        "200":
          description: Mode summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseModeSummary" }
        "400": { description: Invalid mode. }
        "401": { description: Not authenticated. }
        "403": { description: No Decision Room access. }

  /decision-room/{mode}/releases:
    get:
      tags: [decision-room]
      operationId: listReleases
      summary: List CVO releases for a mode (newest first)
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
      responses:
        "200":
          description: Releases.
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items: { $ref: "#/components/schemas/ReleaseSummary" }
        "401": { description: Not authenticated. }
        "403": { description: No Decision Room access. }
    post:
      tags: [decision-room]
      operationId: createRelease
      summary: Create a new CVO release record
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseCreateBody" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDetail" }
        "400": { description: Invalid input. }
        "401": { description: Not authenticated. }
        "403": { description: No Decision Room access. }

  /decision-room/{mode}/releases/{id}:
    get:
      tags: [decision-room]
      operationId: getRelease
      summary: Get one CVO release record with consultations
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Release detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDetail" }
        "400": { description: Mode mismatch. }
        "401": { description: Not authenticated. }
        "403": { description: No Decision Room access. }
        "404": { description: Not found. }
    patch:
      tags: [decision-room]
      operationId: updateRelease
      summary: Update a CVO release record (substantive edits invalidate signoffs)
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseUpdateBody" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDetail" }
        "400": { description: Invalid input or mode mismatch. }
        "401": { description: Not authenticated. }
        "403": { description: Forbidden. }
        "404": { description: Not found. }
    delete:
      tags: [decision-room]
      operationId: deleteRelease
      summary: Delete a draft/in_review CVO release
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400": { description: Mode mismatch or status prevents delete. }
        "401": { description: Not authenticated. }
        "403": { description: Forbidden. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/consult:
    post:
      tags: [decision-room]
      operationId: consultReleasepillars
      summary: Run governed pillar consultation on a release
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseConsultBody" }
      responses:
        "200":
          description: Consultations recorded.
          content:
            application/json:
              schema:
                type: object
                required: [consultations]
                properties:
                  consultations:
                    type: array
                    items: { $ref: "#/components/schemas/PillarConsultation" }
        "400":
          {
            description: "Own-view missing, invalid pillars, or mode mismatch.",
          }
        "401": { description: Not authenticated. }
        "403": { description: No Decision Room access. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/faculty-signoff:
