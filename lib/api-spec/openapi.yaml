        "401": { description: Not authenticated. }
        "403": { description: Platform admin (CVO) only. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/withdraw:
    post:
      tags: [decision-room]
      operationId: withdrawRelease
