      type: string
      enum: [booked, revenue_recorded, settled]
    FrameworkBookingTarget:
      type: string
      enum: [interpretation, newsletter_post, communication_offer, article]
    FrameworkBooking:
      type: object
      required:
        [
          id,
          frameworkId,
          ownerPillarId,
          bookerPillarId,
          status,
          sharePct,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        frameworkId: { type: integer }
        ownerPillarId: { type: integer }
        ownerUserId: { type: integer, nullable: true }
        bookerPillarId: { type: integer }
        bookerUserId: { type: integer, nullable: true }
        targetType:
          {
            $ref: "#/components/schemas/FrameworkBookingTarget",
            nullable: true,
          }
        targetId: { type: integer, nullable: true }
        targetTitle: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/FrameworkBookingStatus" }
        revenueCents: { type: integer, nullable: true }
        sharePct: { type: integer }
        ownerShareCents: { type: integer, nullable: true }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        revenueRecordedAt: { type: string, format: date-time, nullable: true }
        settledAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    PillarResource:
      type: object
      required: [id, title, url, displayOrder]
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        displayOrder: { type: integer }
    FrameworkBookingListItem:
      allOf:
        - { $ref: "#/components/schemas/FrameworkBooking" }
        - type: object
          properties:
            frameworkName: { type: string, nullable: true }
            ownerName: { type: string, nullable: true }
            ownerPillarName: { type: string, nullable: true }
            bookerName: { type: string, nullable: true }
            bookerPillarName: { type: string, nullable: true }
    FrameworkBookingSummary:
      type: object
      required: [count, owedCents, settledCents, revenueCents]
      properties:
        count: { type: integer }
        owedCents: { type: integer }
        settledCents: { type: integer }
        revenueCents: { type: integer }
    FrameworkBookingsResponse:
      type: object
      required: [bookings, summary]
      properties:
        bookings:
          type: array
          items: { $ref: "#/components/schemas/FrameworkBookingListItem" }
        summary: { $ref: "#/components/schemas/FrameworkBookingSummary" }
    BookFrameworkInput:
      type: object
      required: [frameworkId, bookerPillarId]
      properties:
        frameworkId: { type: integer }
        bookerPillarId: { type: integer }
        targetType: { $ref: "#/components/schemas/FrameworkBookingTarget" }
        targetId: { type: integer }
        targetTitle: { type: string, maxLength: 300 }
        note: { type: string, maxLength: 1000 }
    RecordRevenueInput:
      type: object
      required: [revenueCents]
      properties:
        revenueCents: { type: integer, minimum: 0 }
    UpdateBookingInput:
      type: object
      properties:
        status: { $ref: "#/components/schemas/FrameworkBookingStatus" }
        ownerShareCents: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 1000, nullable: true }
