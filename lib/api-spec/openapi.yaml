      tags: [decision-room]
      operationId: facultySignoff
      summary: Record substantive faculty sign-off on a release (invalidates CVO verification)
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacultySignoffBody" }
      responses:
        "200":
          description: Signed off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDetail" }
        "400": { description: Mode mismatch or release not eligible. }
        "401": { description: Not authenticated. }
        "403": { description: Forbidden. }
        "404": { description: Not found. }

  /decision-room/{mode}/releases/{id}/cvo-verification:
    post:
      tags: [decision-room]
      operationId: cvoVerification
      summary: CVO process verification of a release (requires prior faculty signoff)
      parameters:
        - {
            name: mode,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ReleaseMode" },
          }
