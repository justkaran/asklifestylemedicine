    SourceKind:
      type: string
      enum: [paper, slm_article, note]
    SourceStatus:
      type: string
      enum: [draft, in_review, approved, archived]
    SourceRightsBasis:
      type: string
      nullable: true
      enum:
        [
          open_license,
          permission,
          public_domain,
          no_documented_full_text_rights,
        ]
      description: Contributor-recorded basis for processing a paper's full text.
    SourceRetentionStatus:
      type: string
      nullable: true
      enum:
        [
          needs_review,
          review_window,
          retained_with_rights,
          purged_no_full_text_rights,
        ]
      description: Whether paper-derived material is available for faculty review or has been purged.
    SourceAssessmentStatus:
      type: string
      nullable: true
      enum: [draft, approved]
      description: >-
        Reliability-assessment lifecycle, INDEPENDENT of the source's
        publication status. null = not assessed yet, draft = a steward is
        working on it (never public), approved = steward-approved and the
        public trust badge is live.
    SourceListItem:
      type: object
      required:
        [id, kind, title, status, version, automaticallyDiscovered, excluded, createdAt, updatedAt]
      properties:
        id: { type: integer }
        kind: { $ref: "#/components/schemas/SourceKind" }
        title: { type: string }
        authors: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        journal: { type: string, nullable: true }
        doi: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        studyDesign: { type: string, nullable: true }
        rightsBasis: { $ref: "#/components/schemas/SourceRightsBasis" }
        retentionStatus: { $ref: "#/components/schemas/SourceRetentionStatus" }
        rightsRecordedAt: { type: string, format: date-time, nullable: true }
        purgedAt: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/SourceStatus" }
        version: { type: integer }
        assessmentStatus:
          { $ref: "#/components/schemas/SourceAssessmentStatus" }
        rigorScore: { type: integer, nullable: true }
        reproducibilityScore: { type: integer, nullable: true }
        opennessScore: { type: integer, nullable: true }
        automaticallyDiscovered: { type: boolean }
        excluded: { type: boolean }
        excludedAt: { type: string, format: date-time, nullable: true }
        exclusionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SourceDetail:
      type: object
      required: [source, chunkCount, chunks, audit]
      properties:
        source:
          type: object
          required: [id, kind, title, status, version, createdAt, updatedAt]
          properties:
            id: { type: integer }
            kind: { $ref: "#/components/schemas/SourceKind" }
            title: { type: string }
            authors: { type: string, nullable: true }
            year: { type: integer, nullable: true }
            journal: { type: string, nullable: true }
            doi: { type: string, nullable: true }
            sourceUrl: { type: string, nullable: true }
            studyDesign: { type: string, nullable: true }
            status: { $ref: "#/components/schemas/SourceStatus" }
            version: { type: integer }
            abstract: { type: string, nullable: true }
            fullText: { type: string, nullable: true }
            rightsBasis: { $ref: "#/components/schemas/SourceRightsBasis" }
            retentionStatus:
              { $ref: "#/components/schemas/SourceRetentionStatus" }
            rightsRecordedAt:
              { type: string, format: date-time, nullable: true }
            purgedAt: { type: string, format: date-time, nullable: true }
            assessmentStatus:
              { $ref: "#/components/schemas/SourceAssessmentStatus" }
            rigorScore: { type: integer, nullable: true }
            reproducibilityScore: { type: integer, nullable: true }
            opennessScore: { type: integer, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        chunkCount: { type: integer }
        reviewPassagesAvailable:
          type: boolean
          description: True only while faculty may inspect temporary source passages.
        chunks:
          type: array
          items:
            type: object
            required: [id, chunkIndex, text]
            properties:
              id: { type: integer }
              chunkIndex: { type: integer }
              text: { type: string }
              page: { type: integer, nullable: true }
              section: { type: string, nullable: true }
        audit:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              action: { type: string }
              fromStatus: { type: string, nullable: true }
              toStatus: { type: string, nullable: true }
              note: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
        role: { type: string, nullable: true }
    ReliabilityAnswer:
      type: string
      enum: [yes, partial, no, unclear]
      description: >-
        Per-item judgement. yes=1, partial=0.5, no=0; unclear is EXCLUDED from
        the axis score (the paper is not punished for an item the text does not
        address) but lowers coverage.
    ReliabilityItemAnswer:
      type: object
      required: [id, answer, rationale]
      properties:
        id: { type: string }
        answer: { $ref: "#/components/schemas/ReliabilityAnswer" }
        rationale:
          type: string
          description: One-line rationale describing the PAPER, never the steward.
    ReliabilityAxisAnswers:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReliabilityItemAnswer" }
    ReliabilityRubric:
      type: object
      description: >-
        The full three-axis rubric persisted per source. Server-normalized to
        the canonical item set on every write, so unknown ids cannot smuggle
        fields into a public response.
      required: [rigor, reproducibility, openness]
      properties:
        rigor: { $ref: "#/components/schemas/ReliabilityAxisAnswers" }
        reproducibility: { $ref: "#/components/schemas/ReliabilityAxisAnswers" }
        openness: { $ref: "#/components/schemas/ReliabilityAxisAnswers" }
    ReliabilityAxisScore:
      type: object
      required: [score, assessed, total]
      properties:
        score:
          type: integer
          nullable: true
          description: 0..100, or null when every item is unclear.
        assessed:
          type: integer
          description: Items answered yes/partial/no (coverage numerator).
        total: { type: integer }
    SourceAssessmentScores:
      type: object
      required: [rigor, reproducibility, openness]
      properties:
        rigor: { $ref: "#/components/schemas/ReliabilityAxisScore" }
        reproducibility: { $ref: "#/components/schemas/ReliabilityAxisScore" }
        openness: { $ref: "#/components/schemas/ReliabilityAxisScore" }
    SourceAssessment:
      type: object
      description: >-
        Faculty-facing reliability assessment for one source. Scores are
        recomputed server-side from the item answers and never trusted from the
        client. assessedByName appears ONLY on this faculty surface, never in
        the consumer provenance.
      required:
        [
          assessmentStatus,
          rubric,
          scores,
          aiDraft,
          aiAcceptance,
          assessedAt,
          assessedByName,
          canEdit,
        ]
      properties:
        assessmentStatus:
          { $ref: "#/components/schemas/SourceAssessmentStatus" }
        rubric:
          oneOf:
            - { $ref: "#/components/schemas/ReliabilityRubric" }
            - { type: "null" }
        scores:
          oneOf:
            - { $ref: "#/components/schemas/SourceAssessmentScores" }
            - { type: "null" }
        aiDraft:
          oneOf:
            - { $ref: "#/components/schemas/ReliabilityRubric" }
            - { type: "null" }
        aiAcceptance:
          type: string
          nullable: true
          description: How much of the AI draft the steward kept at approval.
        assessedAt: { type: string, format: date-time, nullable: true }
        assessedByName: { type: string, nullable: true }
        canEdit:
          type: boolean
          description: True only for a steward of this pillar.
        generated:
          type: boolean
          description: >-
            Present on the draft endpoint only. False when the AI was
            unavailable and the steward must assess by hand.
    SourceAssessmentInput:
      type: object
      required: [rubric, status]
      properties:
        rubric:
          description: >-
            Loose rubric JSON; server normalizes to the canonical item set and
            recomputes scores. Client-supplied numbers are ignored.
        status:
          type: string
          enum: [draft, approved]
          description: Saving with approved IS the steward approval.
    InterpretationStatus:
      type: string
      enum: [proposed, approved, archived]
    InterpretationOrigin:
      type: string
      enum: [faculty, palonur_ai]
