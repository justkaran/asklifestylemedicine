kind = "web"
previewPath = "/faculty/"
title = "Palonur Faculty"
version = "1.0.0"
id = "artifacts/faculty"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/faculty/" ]
localPort = 24612

[services.development]
run = "pnpm --filter @workspace/faculty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/faculty", "run", "build" ]
publicDir = "artifacts/faculty/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24612"
BASE_PATH = "/faculty/"
